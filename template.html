<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<meta name="description" content="{desc}">
<link rel="preload" href="theme/fonts/garamond.woff2" as="font" type="font/woff2" crossorigin>
<script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t } catch (e) {}</script>
<link rel="stylesheet" href="theme/style.css">
<link rel="icon" href="theme/icon.png">
{head}
</head>
<body class="{cls}">
<a class="skip" href="#main">Skip to the text</a>
<input type="checkbox" id="menu" class="menu-toggle" aria-label="Show the menu">
<header class="bar">

  <div class="search">
    <input id="q" type="search" placeholder="Search the rules" autocomplete="off" aria-label="Search the rules">
    <ol id="hits" hidden></ol>

  <label class="menu-btn" for="menu">Menu</label>

<div class="frame">
<nav class="side" aria-label="Menu">
{nav}
</nav>
<main id="main">
{content}
</main>
</div>

</footer>
